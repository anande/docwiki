<title>RHOSO 18.0 — Architecture Flow Visualizer</title>
<link rel="stylesheet" href="https://noyitz.github.io/flowstory/templates/style.css">
<style>
/* Overlay tooltip styles (required for click-to-view component details) */
#fs-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 9999;
}
#fs-overlay-card {
  position: absolute;
  background: var(--fs-bg-surface, #161b22); border: 1px solid var(--fs-border, #30363d);
  border-radius: 16px; padding: 28px 32px; max-width: 520px; width: 420px;
  max-height: 80vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#fs-overlay-accent {
  height: 4px; border-radius: 2px; margin-bottom: 16px;
}
#fs-overlay-title {
  font-size: 20px; font-weight: 700; margin-bottom: 8px;
}
#fs-overlay-desc {
  font-size: 14px; line-height: 1.6; margin-bottom: 16px;
  color: var(--fs-text, #c9d1d9);
}
#fs-overlay-details {
  font-size: 13px; margin-bottom: 16px;
}
#fs-overlay-links { margin-bottom: 16px; }
#fs-overlay-close {
  position: absolute; top: 12px; right: 16px; background: none;
  border: none; color: var(--fs-text-dim, #8b949e); font-size: 24px;
  cursor: pointer; line-height: 1; z-index: 10;
}
#fs-overlay-close:hover { color: var(--fs-text-bright, #fff); }
#fs-overlay-resume {
  display: block; width: 100%; padding: 10px;
  background: var(--fs-bg, #0d1117); border: 1px solid var(--fs-success, #3fb950);
  border-radius: 8px; color: var(--fs-success, #3fb950);
  font-size: 14px; cursor: pointer; text-align: center;
}
#fs-overlay-resume:hover { background: #3fb95022; }
#fs-highlight-box {
  position: fixed; display: none; z-index: 9998;
  pointer-events: none; border-radius: 8px;
}
/* Light mode: make white wordmark in logo visible on light background */
body.light .fs-brand img {
  filter: brightness(0) saturate(100%);
  /* turns white text black, keeps red hat recognizable */
}
</style>
</head>
<body>
<button class="fs-theme-toggle" id="fs-theme" aria-label="Toggle theme">☾</button>

<div class="fs-brand" id="fs-brand"></div>
<h1 class="fs-title" id="fs-title"></h1>

<canvas id="fs-canvas"></canvas>
<div id="fs-highlight-box"></div>

<!-- Right Panel -->
<div class="fs-panel">
  <div class="fs-flow-bar">
    <select id="fs-flow-select"></select>
    <button class="fs-start" id="fs-play">&#9654; Start</button>
    <button id="fs-speed">1x</button>
    <button id="fs-loop">&#8635; Loop</button>
    <button class="fs-reset" id="fs-reset">Reset</button>
  </div>

  <div class="fs-steps">
    <div class="fs-steps-title">Flow Steps &middot; click to jump</div>
    <div id="fs-steps-container"></div>
  </div>

  <div class="fs-inspector">
    <div class="fs-inspector-title" id="fs-inspector-title">Request</div>
    <div id="fs-inspector-content"></div>
  </div>
</div>

<div class="fs-legend" id="fs-legend"></div>

<div id="fs-overlay">
  <div id="fs-overlay-card">
    <button id="fs-overlay-close">&times;</button>
    <div id="fs-overlay-accent"></div>
    <h2 id="fs-overlay-title"></h2>
    <p id="fs-overlay-desc"></p>
    <div id="fs-overlay-details"></div>
    <div id="fs-overlay-links"></div>
    <button id="fs-overlay-resume">&#9654; Resume Flow</button>

</div>

    "live_migration": {
      "label": "② Live Migration (P2P)",
      "steps": [
        {
          "text": "1. Admin: POST /servers/{id}/action {migrate: {host: compute-1}}",

        {
          "text": "5. Conductor claims allocation on dest (compute-1)",
          "mode": "lightup",
          "target": "placement",
          "badge": 5
        },
        {
          "text": "6. Conductor casts live_migration() to source compute-0",
          "mode": "arrow",
          "from": "nova_conductor",

          "color": "#58a6ff",
          "num": 6,
          "fromBottom": true,
          "toTop": true
        },
        {
          "text": "7. Source compute calls pre_live_migration() on dest",

          "to": "nova_compute_b",
          "color": "#58a6ff",
          "num": 7
        },
        {
          "text": "8. Dest compute prepares: connect volumes, create net",
          "mode": "lightup",
          "target": "nova_compute_b",

        {
          "text": "9. Dest Libvirt prepares incoming migration listener",
          "mode": "lightup",
          "target": "libvirt_b",
          "badge": 9
        },
        {
          "text": "10. Source Libvirt: virDomainMigrateToURI3() (pre-copy)",
          "mode": "arrow",
          "from": "libvirt_a",
          "to": "libvirt_b",
          "color": "#f0883e",
          "num": 10
        },
        {
          "text": "11. Phase 1: Bulk RAM transfer (iterative dirty pages)",
          "mode": "lightup",
          "target": "libvirt_a",
          "badge": "RAM"
        },
        {
          "text": "12. Phase 2: Converging — dirty page rate decreasing",
          "mode": "lightup",
          "target": "libvirt_b",
          "badge": "..."
        },
        {
          "text": "13. Phase 3: Final switchover (brief pause <100ms)",
          "mode": "lightup",
          "target": "libvirt_b",
          "badge": "✓"
        },
        {
          "text": "14. OVN rebinds port: Chassis=compute-1 in Southbound DB",

          "from": "ovn_sb",
          "to": "ovn_ctrl_b",
          "color": "#79c0ff",
          "num": 14,
          "fromBottom": true,
          "toTop": true
        },
        {
          "text": "15. New chassis OVN Controller programs local OVS flows",
          "mode": "lightup",
          "target": "ovn_ctrl_b",
          "badge": 15
        },
        {
          "text": "16. Gratuitous ARP sent — MAC moves to new compute",
          "mode": "lightup",
          "target": "ovs_b",
          "badge": "ARP"
        },
        {
          "text": "17. Source cleans up: undefine domain, release resources",
          "mode": "lightup",
          "target": "libvirt_a",
          "badge": "🗑"
        },
        {
          "text": "18. Source releases Placement allocation (compute-0)",
          "mode": "lightup",
          "target": "placement",
          "badge": "-"
        },
        {
          "text": "19. Conductor updates DB: host=compute-1, state=ACTIVE",
          "mode": "arrow",
          "from": "nova_compute_b",
          "to": "nova_conductor",
          "color": "#3fb950",
          "num": 19,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "20. VM now running on compute-1 — zero downtime achieved",
          "mode": "lightup",
          "target": "vm_b",
          "badge": "✓"
        }
      ]

          "target": "ovs_a",

          "text": "20. (6) br-ex: SWAPS internal VLAN tag=5 → actual VLAN 101 (802.1q)",

          "target": "ovs_a",
          "badge": "5→101"

        {
          "text": "21. (7) br-ex: forwards tagged frame to physical port (eth1)",

    "vm_to_vm_ping": {
      "label": "⑫ VM-to-VM Ping (OVN/OVS Path)",
      "steps": [
        {
          "text": "1. VM-A (10.0.0.5) pings VM-B (10.0.0.6) on same subnet",
          "mode": "arrow",
          "from": "vm_a",
          "to": "ovs_a",
          "color": "#58a6ff",
          "num": 1,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "2. VM-A needs MAC of VM-B: sends ARP who-has 10.0.0.6",
          "mode": "lightup",
          "target": "ovs_a",
          "badge": "ARP"
        },
        {
          "text": "3. OVS br-int: ARP hits OpenFlow table → OVN Controller",
          "mode": "arrow",
          "from": "ovs_a",
          "to": "ovn_ctrl_a",
          "color": "#58a6ff",
          "num": 3
        },
        {
          "text": "4. OVN has ARP responder flow (knows all port MACs from NB)",
          "mode": "lightup",
          "target": "ovn_ctrl_a",
          "badge": 4
        },
        {
          "text": "5. OVN replies: 10.0.0.6 is at MAC fa:16:3e:bb:bb:bb",
          "mode": "arrow",
          "from": "ovn_ctrl_a",
          "to": "ovs_a",
          "color": "#3fb950",
          "num": 5
        },
        {
          "text": "6. VM-A constructs ICMP echo: dst=fa:16:3e:bb:bb:bb",
          "mode": "lightup",
          "target": "vm_a",
          "badge": "ICMP"
        },
        {
          "text": "7. Packet enters br-int on compute-0 via tap-A port",
          "mode": "arrow",
          "from": "vm_a",
          "to": "ovs_a",
          "color": "#58a6ff",
          "num": 7,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "8. OpenFlow lookup: dst MAC belongs to port on compute-1",
          "mode": "lightup",
          "target": "ovs_a",
          "badge": 8
        },
        {
          "text": "9. OVS encapsulates in Geneve header (VNI = network segID)",
          "mode": "arrow",
          "from": "ovs_a",
          "to": "geneve_tunnel",
          "color": "#58a6ff",
          "num": 9,
          "fromBottom": true,
          "toTop": true
        },
        {
          "text": "10. Geneve packet: outer IP src=compute-0, dst=compute-1",
          "mode": "lightup",
          "target": "geneve_tunnel",
          "badge": "UDP:6081"
        },
        {
          "text": "11. Physical network transports encapsulated packet",
          "mode": "arrow",
          "from": "geneve_tunnel",
          "to": "ovs_b",
          "color": "#58a6ff",
          "num": 11,
          "fromRight": true,
          "toLeft": true
        },
        {
          "text": "12. Compute-1 OVS: decapsulates Geneve, extracts inner frame",
          "mode": "lightup",
          "target": "ovs_b",
          "badge": "decap"
        },
        {
          "text": "13. OpenFlow: dst MAC matches local port tap-B",
          "mode": "lightup",
          "target": "ovs_b",
          "badge": 13
        },
        {
          "text": "14. Security group ACL check: ICMP ingress allowed?",
          "mode": "lightup",
          "target": "ovn_ctrl_b",
          "badge": "SG"
        },
        {
          "text": "15. Conntrack: ct(commit) — stateful firewall allows",
          "mode": "lightup",
          "target": "ovs_b",
          "badge": "CT"
        },
        {
          "text": "16. Packet delivered to VM-B via tap-B interface",
          "mode": "arrow",
          "from": "ovs_b",
          "to": "vm_b",
          "color": "#3fb950",
          "num": 16,
          "fromBottom": true,
          "toTop": true
        },
        {
          "text": "17. VM-B kernel: ICMP echo reply generated",
          "mode": "lightup",
          "target": "vm_b",
          "badge": "reply"
        },
        {
          "text": "18. Reply follows reverse path: tap-B → br-int → Geneve → compute-0",
          "mode": "arrow",
          "from": "vm_b",
          "to": "ovs_b",
          "color": "#3fb950",
          "num": 18,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "19. Geneve tunnel: compute-1 → compute-0 (reverse)",
          "mode": "arrow",
          "from": "ovs_b",
          "to": "geneve_tunnel",
          "color": "#3fb950",
          "num": 19
        },
        {
          "text": "20. Compute-0 decapsulates → delivers to VM-A: ping reply!",
          "mode": "arrow",
          "from": "geneve_tunnel",
          "to": "vm_a",
          "color": "#3fb950",
          "num": 20,
          "fromLeft": true,
          "toRight": true
        },
        {
          "text": "21. VM-A: 64 bytes from 10.0.0.6: icmp_seq=1 time=0.8ms",
          "mode": "lightup",
          "target": "vm_a",
          "badge": "✓"
        }
      ]
    },

    "fip_dnat_snat": {
      "label": "⑭ Floating IP DNAT/SNAT — N-S Packet Path",
      "steps": [
        {
          "text": "1. VM-A sends packet to external dest 8.8.8.8 (src 10.0.0.5)",
          "mode": "arrow",
          "from": "vm_a",
          "to": "ovs_a",
          "color": "#79c0ff",
          "num": 1,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "2. OVS br-int: packet hits conntrack zone, enters OVN pipeline",
          "mode": "lightup",
          "target": "ovs_a",
          "badge": "ct"
        },
        {
          "text": "3. OVN Controller: logical router pipeline — distributed SNAT check",
          "mode": "arrow",
          "from": "ovs_a",
          "to": "ovn_ctrl_a",
          "color": "#79c0ff",
          "num": 3,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "4. FIP present → distributed NAT: SNAT 10.0.0.5 → 203.0.113.10",
          "mode": "lightup",
          "target": "ovn_ctrl_a",
          "badge": "SNAT"
        },
        {
          "text": "5. Packet routed to gateway chassis via overlay (cr-lrp binding)",
          "mode": "arrow",
          "from": "ovn_ctrl_a",
          "to": "ovn_gw",
          "color": "#79c0ff",
          "num": 5,
          "fromRight": true,
          "toLeft": true
        },
        {
          "text": "6. Gateway chassis: cr-lrp processes N-S egress, ARP for next-hop",
          "mode": "lightup",
          "target": "ovn_gw",
          "badge": "cr-lrp"
        },
        {
          "text": "7. Packet egresses to external network (src 203.0.113.10)",
          "mode": "arrow",
          "from": "ovn_gw",
          "to": "ext_network",
          "color": "#79c0ff",
          "num": 7,
          "fromBottom": true,
          "toTop": true
        },
        {
          "text": "8. External host replies to 203.0.113.10 (return traffic)",
          "mode": "arrow",
          "from": "ext_network",
          "to": "ovn_gw",
          "color": "#3fb950",
          "num": 8,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "9. Gateway: conntrack ESTABLISHED — skip re-NAT, forward to cr-lrp",
          "mode": "lightup",
          "target": "ovn_gw",
          "badge": "ct-est"
        },
        {
          "text": "10. Gateway relays return packet via geneve tunnel to compute-0",

          "from": "ovn_gw",
          "to": "geneve_tunnel",
          "color": "#79c0ff",
          "num": 10
        },
        {
          "text": "11. Geneve decap on compute-0, packet enters br-int",
          "mode": "arrow",
          "from": "geneve_tunnel",
          "to": "ovs_a",
          "color": "#79c0ff",
          "num": 11
        },
        {
          "text": "12. OVN Controller: reverse DNAT 203.0.113.10 → 10.0.0.5",
          "mode": "lightup",
          "target": "ovn_ctrl_a",
          "badge": "DNAT"
        },
        {
          "text": "13. Packet delivered to VM-A port (dst 10.0.0.5)",
          "mode": "arrow",
          "from": "ovs_a",
          "to": "vm_a",
          "color": "#3fb950",
          "num": 13,
          "fromBottom": true,
          "toTop": true
        },
        {
          "text": "14. — INBOUND PATH — External client initiates to FIP 203.0.113.10",
          "mode": "arrow",
          "from": "ext_network",
          "to": "ovn_gw",
          "color": "#58a6ff",
          "num": 14,
          "fromTop": true,
          "toBottom": true
        },
        {
          "text": "15. Gateway: DNAT 203.0.113.10 → 10.0.0.5, new conntrack entry",
          "mode": "lightup",
          "target": "ovn_gw",
          "badge": "DNAT"
        },
        {
          "text": "16. Packet tunneled to compute-0 via geneve (VNI match)",
          "mode": "arrow",
          "from": "ovn_gw",
          "to": "geneve_tunnel",
          "color": "#79c0ff",
          "num": 16
        },
        {
          "text": "17. OVS br-int delivers to VM-A tap port",
          "mode": "arrow",
          "from": "geneve_tunnel",
          "to": "vm_a",
          "color": "#79c0ff",
          "num": 17
        },
        {
          "text": "18. VM-A receives packet on 10.0.0.5 — full N-S path verified",
          "mode": "lightup",
          "target": "vm_a",
          "badge": "✓"
        }
      ]

    "keystone_federation": {
      "label": "㉗ Keystone Federation (External IdP via OIDC)",
      "steps": [
        {
          "text": "1. Cloud User: access OpenStack dashboard / CLI (no local password)",
          "mode": "arrow",
          "from": "cloud_user",
          "to": "keystone",
          "color": "#f0883e",
          "num": 1,
          "fromRight": true,
          "toLeft": true
        },
        {
          "text": "2. Keystone: user has no local credentials → OIDC federation configured",
          "mode": "lightup",
          "target": "keystone",
          "badge": "OIDC"
        },
        {
          "text": "3. Keystone returns 302 Redirect to corporate IdP authorize endpoint",
          "mode": "arrow",
          "from": "keystone",
          "to": "cloud_user",
          "color": "#f0883e",
          "num": 3,
          "fromLeft": true,
          "toRight": true
        },
        {
          "text": "4. Browser follows redirect → IdP login page (SAML/OIDC)",
          "mode": "arrow",
          "from": "cloud_user",
          "to": "ext_idp",
          "color": "#f0883e",
          "num": 4,
          "fromRight": true,
          "toLeft": true
        },
        {
          "text": "5. User authenticates at IdP (MFA, SSO session cookie)",
          "mode": "lightup",
          "target": "ext_idp",
          "badge": "MFA"
        },
        {
          "text": "6. IdP validates credentials → issues authorization code",
          "mode": "lightup",
          "target": "ext_idp",
          "badge": "✓"
        },
        {
          "text": "7. IdP redirects back to Keystone callback with auth code",
          "mode": "arrow",
          "from": "ext_idp",
          "to": "keystone",
          "color": "#f0883e",
          "num": 7
        },
        {
          "text": "8. Keystone exchanges auth code for IdP access token (back-channel)",
          "mode": "arrow",
          "from": "keystone",
          "to": "ext_idp",
          "color": "#f0883e",
          "num": 8
        },
        {
          "text": "9. IdP returns id_token + access_token (JWT with claims)",
          "mode": "lightup",
          "target": "ext_idp",
          "badge": "JWT"
        },
        {
          "text": "10. Keystone validates JWT signature (JWKS from IdP)",
          "mode": "lightup",
          "target": "keystone",
          "badge": "verify"
        },
        {
          "text": "11. Keystone mapping engine: IdP groups → OpenStack projects/roles",
          "mode": "lightup",
          "target": "keystone",
          "badge": "map"
        },
        {
          "text": "12. Mapping: IdP group 'cloud-admins' → project 'admin', role 'admin'",
          "mode": "lightup",
          "target": "keystone",
          "badge": "roles"
        },
        {
          "text": "13. Keystone issues scoped Fernet token (project-scoped)",
          "mode": "lightup",
          "target": "keystone",
          "badge": "Fernet"
        },
        {
          "text": "14. Fernet token cached in Memcached (TTL=3600s)",
          "mode": "arrow",
          "from": "keystone",
          "to": "memcached",
          "color": "#8b949e",
          "num": 14,
          "fromBottom": true,
          "toTop": true
        },
        {
          "text": "15. Keystone returns scoped token to user (X-Subject-Token)",
          "mode": "arrow",
          "from": "keystone",
          "to": "cloud_user",
          "color": "#3fb950",
          "num": 15,
          "fromLeft": true,
          "toRight": true
        },
        {
          "text": "16. User calls Nova API with federated Fernet token",
          "mode": "arrow",
          "from": "cloud_user",
          "to": "nova_api",
          "color": "#58a6ff",
          "num": 16,
          "fromRight": true,
          "toLeft": true
        }
      ]
    },

    "stretch_cluster": {
      "label": "Ceph Stretch Cluster (3-Site)",
      "steps": [
        {
          "from": "platform_admin",
          "to": "rook_operator",
          "label": "Configure stretchCluster in CephCluster CR",
          "color": "#d2a8ff",
          "description": "Admin sets spec.mon.stretchCluster with failureDomainLabel, zones (site-a, site-b, arbiter), and arbiterMonCount=1."
        },
        {
          "from": "rook_operator",
          "to": "ceph_mon",
          "label": "Deploy MONs: 2@Site-A, 2@Site-B",
          "color": "#d2a8ff",
          "description": "Rook deploys 4 data MONs: 2 scheduled to Site-A nodes (zone affinity), 2 scheduled to Site-B nodes via topology labels."
        },
        {
          "from": "rook_operator",
          "to": "arbiter_mon",
          "label": "Deploy arbiter MON at Site-C",
          "color": "#d2a8ff",
          "description": "Rook deploys lightweight arbiter MON at Site-C (tiebreaker). Arbiter participates in quorum but holds no data copies."
        },
        {
          "from": "rook_operator",
          "to": "ceph_osd",
          "label": "CRUSH rules: min_size=2 per site",
          "color": "#d2a8ff",
          "description": "Rook configures CRUSH rules with step chooseleaf for each site. Pool min_size=2 ensures each site has a full copy."
        },
        {
          "target": "ceph_osd",
          "mode": "lightup",
          "label": "OSDs registered at respective sites",
          "color": "#8b949e",
          "description": "OSDs have CRUSH location set to their respective failure domains (site-a, site-b). Data distributed across both sites."
        },
        {
          "from": "vm_a",
          "to": "ceph_osd",
          "label": "Data written to Site-A and Site-B",
          "color": "#58a6ff",
          "description": "Writes replicated synchronously to both sites. Client ACK only after both site replicas confirm. Strong consistency guaranteed."
        },
        {
          "target": "arbiter_mon",
          "mode": "lightup",
          "label": "Arbiter provides tiebreaker",
          "color": "#8b949e",
          "description": "Arbiter MON at Site-C participates in Paxos leader election, providing the 3rd/5th vote needed for MON quorum decisions."
        },
        {
          "target": "ceph_mon",
          "mode": "lightup",
          "label": "Normal quorum: 5 MONs",
          "color": "#3fb950",
          "description": "Full quorum operational: 2 MONs Site-A + 2 MONs Site-B + 1 arbiter Site-C = 5 MONs, majority = 3 needed for quorum."
        },
        {
          "target": "ceph_mon",
          "mode": "lightup",
          "label": "SITE-A FAILS",
          "color": "#f85149",
          "description": "Site-A becomes unreachable. 2 MONs at Site-A lost. Remaining: 2 MONs Site-B + 1 arbiter = 3, still achieves quorum."
        },
        {
          "from": "arbiter_mon",
          "to": "ceph_mon",
          "label": "Arbiter + Site-B maintain quorum",
          "color": "#f0883e",
          "description": "Arbiter MON and 2 Site-B MONs form majority (3/5). Cluster remains operational. New leader elected from surviving MONs."
        },
        {
          "target": "ceph_osd",
          "mode": "lightup",
          "label": "stretch_mode: degraded writes",
          "color": "#f0883e",
          "description": "Ceph enters stretch degraded mode. Writes proceed with only Site-B replicas (min_size met locally). RPO=0 until site recovery."
        },
        {
          "target": "vm_b",
          "mode": "lightup",
          "label": "VMs on surviving site continue",
          "color": "#3fb950",
          "description": "VMs on Site-B compute nodes continue I/O without interruption. Volumes accessible via surviving OSDs and degraded write mode."
        },
        {
          "target": "ceph_mon",
          "mode": "lightup",
          "label": "Site-A recovers",
          "color": "#58a6ff",
          "description": "Site-A network restored. MONs at Site-A rejoin the cluster and begin synchronizing missed Paxos transactions."
        },
        {
          "from": "ceph_mon",
          "to": "arbiter_mon",
          "label": "MONs rejoin quorum (5/5)",
          "color": "#3fb950",
          "description": "All 5 MONs back in quorum. Paxos leader may re-elect. Cluster transitions out of stretch degraded mode."
        },
        {
          "target": "ceph_osd",
          "mode": "lightup",
          "label": "Data re-replicates to Site-A",
          "color": "#58a6ff",
          "description": "OSDs at Site-A backfill data written during the outage. Recovery I/O distributed across Site-A OSDs until fully consistent."
        },
        {
          "target": "ceph_boundary",
          "mode": "lightup",
          "label": "HEALTH_OK — full stretch restored",
          "color": "#3fb950",
          "description": "All PGs active+clean. Both sites fully replicated. Stretch cluster back to normal operation with synchronous cross-site writes."
        }
      ]
    },

          "target": "compute_a",
          "mode": "lightup",
          "label": "Kernel loads rbd.ko module",

        {
          "target": "compute_a",
          "mode": "lightup",

        },
        {
          "target": "compute_a",
          "mode": "lightup",
          "label": "kubelet calls NodePublishVolume",
          "color": "#58a6ff",
          "description": "kubelet invokes NodePublishVolume to create the final bind mount from staging directory into the pod's volume mount path."
        },
        {
          "from": "csi_rbdplugin",
          "to": "vm_a",
          "label": "Bind mount into pod container",
          "color": "#3fb950",
          "description": "csi-rbdplugin bind-mounts staging path to /var/lib/kubelet/pods/<poduid>/volumes/kubernetes.io~csi/<pvname>/mount."
        },
        {
          "from": "vm_a",
          "to": "compute_a",
          "label": "App → VFS → ext4 → rbd.ko",
          "color": "#58a6ff",
          "description": "Application I/O path: write() syscall → VFS layer → ext4 journal + data → rbd.ko block layer → RADOS object writes."
        },
        {
          "from": "compute_a",
          "to": "csi_rbdplugin",
          "label": "rbd.ko → librados wire protocol",
          "color": "#58a6ff",
          "description": "rbd.ko translates block offset to RADOS object (4MB striping). Kernel libceph sends OSD op messages over TCP/msgr2."
        },
        {
          "from": "csi_rbdplugin",
          "to": "ceph_osd",
          "label": "librados → OSD → replication",
          "color": "#58a6ff",
          "description": "Primary OSD receives write, replicates to replica OSDs per pool replication factor. All replicas ACK before client ACK."
        },
        {
          "from": "ceph_osd",
          "to": "vm_a",
          "label": "ACK propagates back to app",
          "color": "#3fb950",
          "description": "Write ACK path: OSD replicas → primary OSD → kernel rbd.ko → ext4 journal commit → write() syscall returns to application."
        }
      ]
    }
