<link rel="stylesheet" href="https://noyitz.github.io/flowstory/templates/style.css">
<style>
/* Overlay tooltip styles (required for click-to-view component details) */
#fs-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 9999;
}
#fs-overlay-card {
  position: absolute;
  background: var(--fs-bg-surface, #161b22); border: 1px solid var(--fs-border, #30363d);
  border-radius: 16px; padding: 28px 32px; max-width: 520px; width: 420px;
  max-height: 80vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#fs-overlay-accent {
  height: 4px; border-radius: 2px; margin-bottom: 16px;
}
#fs-overlay-title {
  font-size: 20px; font-weight: 700; margin-bottom: 8px;
}
#fs-overlay-desc {
  font-size: 14px; line-height: 1.6; margin-bottom: 16px;
  color: var(--fs-text, #c9d1d9);
}
#fs-overlay-details {
  font-size: 13px; margin-bottom: 16px;
}
#fs-overlay-links { margin-bottom: 16px; }
#fs-overlay-close {
  position: absolute; top: 12px; right: 16px; background: none;
  border: none; color: var(--fs-text-dim, #8b949e); font-size: 24px;
  cursor: pointer; line-height: 1; z-index: 10;
}
#fs-overlay-close:hover { color: var(--fs-text-bright, #fff); }
#fs-overlay-resume {
  display: block; width: 100%; padding: 10px;
  background: var(--fs-bg, #0d1117); border: 1px solid var(--fs-success, #3fb950);
  border-radius: 8px; color: var(--fs-success, #3fb950);
  font-size: 14px; cursor: pointer; text-align: center;
}
#fs-overlay-resume:hover { background: #3fb95022; }
#fs-highlight-box {
  position: fixed; display: none; z-index: 9998;
  pointer-events: none; border-radius: 8px;
}
/* Light mode: make white wordmark in logo visible on light background */
body.light .fs-brand img {
  filter: brightness(0) saturate(100%);
  /* turns white text black, keeps red hat recognizable */
}
</style>
</head>

<button class="fs-theme-toggle" id="fs-theme" aria-label="Toggle theme">☾</button>

<div class="fs-brand" id="fs-brand"></div>
<h1 class="fs-title" id="fs-title"></h1>

<canvas id="fs-canvas"></canvas>
<div id="fs-highlight-box"></div>

<!-- Right Panel -->
<div class="fs-panel">
  <div class="fs-flow-bar">
    <select id="fs-flow-select"></select>
    <button class="fs-start" id="fs-play">&#9654; Start</button>
    <button id="fs-speed">1x</button>
    <button id="fs-loop">&#8635; Loop</button>
    <button class="fs-reset" id="fs-reset">Reset</button>
  </div>

  <div class="fs-steps">
    <div class="fs-steps-title">Flow Steps &middot; click to jump</div>
    <div id="fs-steps-container"></div>
  </div>

  <div class="fs-inspector">
    <div class="fs-inspector-title" id="fs-inspector-title">Request</div>
    <div id="fs-inspector-content"></div>
  </div>
</div>

<div class="fs-legend" id="fs-legend"></div>

<div id="fs-overlay">
  <div id="fs-overlay-card">
    <button id="fs-overlay-close">&times;</button>
    <div id="fs-overlay-accent"></div>
    <h2 id="fs-overlay-title"></h2>
    <p id="fs-overlay-desc"></p>
    <div id="fs-overlay-details"></div>
    <div id="fs-overlay-links"></div>
    <button id="fs-overlay-resume">&#9654; Resume Flow</button>

</div>

        { "text": "7. Nova Conductor picks up from conductor queue", "mode": "arrow", "from": "rabbitmq", "to": "nova_conductor", "color": "#58a6ff", "num": 7 },
        { "text": "8. Conductor calls Scheduler: select_destinations()", "mode": "arrow", "from": "nova_conductor", "to": "nova_sched", "color": "#58a6ff", "num": 8 },
        { "text": "9. Scheduler queries Placement: GET /allocation_candidates", "mode": "arrow", "from": "nova_sched", "to": "placement", "color": "#58a6ff", "num": 9 },
        { "text": "10. Placement returns candidates (VCPU:2, RAM:4096, DISK:40)", "mode": "lightup", "target": "placement", "badge": 10 },
        { "text": "11. Scheduler applies filters: RAM, NUMA, ServerGroup", "mode": "lightup", "target": "nova_sched", "badge": 11 },
        { "text": "12. Scheduler claims allocation in Placement for compute-0", "mode": "lightup", "target": "placement", "badge": "✓" },
        { "text": "13. Conductor casts build_and_run_instance() → compute-0", "mode": "arrow", "from": "nova_conductor", "to": "rabbitmq", "color": "#58a6ff", "num": 13 },
        { "text": "14. RabbitMQ routes to nova.compute.edpm-compute-0 queue", "mode": "arrow", "from": "rabbitmq", "to": "nova_compute_a", "color": "#58a6ff", "num": 14, "fromBottom": true, "toTop": true },
        { "text": "15. Compute claims Neutron port: allocate_for_instance()", "mode": "arrow", "from": "nova_compute_a", "to": "neutron_api", "color": "#58a6ff", "num": 15, "fromTop": true, "toBottom": true },
        { "text": "16. Neutron creates port → OVN NB creates logical port", "mode": "arrow", "from": "neutron_api", "to": "ovn_nb", "color": "#58a6ff", "num": 16, "fromBottom": true, "toTop": true },
        { "text": "17. Compute downloads image from Glance → Ceph COW clone", "mode": "arrow", "from": "nova_compute_a", "to": "ceph_vms", "color": "#58a6ff", "num": 17, "fromRight": true, "toLeft": true },
        { "text": "18. Libvirt defines domain XML + spawns QEMU process", "mode": "arrow", "from": "nova_compute_a", "to": "libvirt_a", "color": "#58a6ff", "num": 18, "fromBottom": true, "toTop": true },
        { "text": "19. Libvirt: virDomainCreate() → QEMU -enable-kvm", "mode": "lightup", "target": "libvirt_a", "badge": 19 },
        { "text": "20. OVN Controller binds port to chassis, programs OVS", "mode": "arrow", "from": "ovn_nb", "to": "ovn_ctrl_a", "color": "#58a6ff", "num": 20, "fromBottom": true, "toTop": true },
        { "text": "21. OVS: br-int flow rules installed (sg, dhcp, tunnel)", "mode": "lightup", "target": "ovs_a", "badge": 21 },
        { "text": "22. VM boots → DHCP from OVN → IP assigned", "mode": "lightup", "target": "vm_a", "badge": "✓" },
        { "text": "23. Compute updates DB: vm_state=ACTIVE, power_state=RUNNING", "mode": "arrow", "from": "nova_compute_a", "to": "nova_conductor", "color": "#3fb950", "num": 23, "fromTop": true, "toBottom": true },
        { "text": "24. Conductor persists final state to Galera", "mode": "arrow", "from": "nova_conductor", "to": "galera_db", "color": "#3fb950", "num": 24 },
        { "text": "25. Response: 202 Accepted → VM ACTIVE (poll GET /servers/{id})", "mode": "arrow", "from": "nova_api", "to": "cloud_user", "color": "#3fb950", "num": 25, "fromLeft": true, "toRight": true, "yOff": 10 }
      ]
    },
    "live_migration": {
      "label": "② Live Migration (P2P)",
      "steps": [
        { "text": "1. Admin: POST /servers/{id}/action {migrate: {host: compute-1}}", "mode": "arrow", "from": "cloud_user", "to": "nova_api", "color": "#58a6ff", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. Nova API sets task_state=MIGRATING in Galera", "mode": "arrow", "from": "nova_api", "to": "galera_db", "color": "#58a6ff", "num": 2, "fromBottom": true, "toTop": true },
        { "text": "3. API casts live_migrate_instance() to Conductor", "mode": "arrow", "from": "nova_api", "to": "nova_conductor", "color": "#58a6ff", "num": 3, "fromBottom": true, "toLeft": true },
        { "text": "4. Conductor checks Placement: can destination host fit?", "mode": "arrow", "from": "nova_conductor", "to": "placement", "color": "#58a6ff", "num": 4 },
        { "text": "5. Conductor claims allocation on dest (compute-1)", "mode": "lightup", "target": "placement", "badge": 5 },
        { "text": "6. Conductor casts live_migration() to source compute-0", "mode": "arrow", "from": "nova_conductor", "to": "nova_compute_a", "color": "#58a6ff", "num": 6, "fromBottom": true, "toTop": true },
        { "text": "7. Source compute calls pre_live_migration() on dest", "mode": "arrow", "from": "nova_compute_a", "to": "nova_compute_b", "color": "#58a6ff", "num": 7 },
        { "text": "8. Dest compute prepares: connect volumes, create net", "mode": "lightup", "target": "nova_compute_b", "badge": 8 },
        { "text": "9. Dest Libvirt prepares incoming migration listener", "mode": "lightup", "target": "libvirt_b", "badge": 9 },
        { "text": "10. Source Libvirt: virDomainMigrateToURI3() (pre-copy)", "mode": "arrow", "from": "libvirt_a", "to": "libvirt_b", "color": "#f0883e", "num": 10 },
        { "text": "11. Phase 1: Bulk RAM transfer (iterative dirty pages)", "mode": "lightup", "target": "libvirt_a", "badge": "RAM" },
        { "text": "12. Phase 2: Converging — dirty page rate decreasing", "mode": "lightup", "target": "libvirt_b", "badge": "..." },
        { "text": "13. Phase 3: Final switchover (brief pause <100ms)", "mode": "lightup", "target": "libvirt_b", "badge": "✓" },
        { "text": "14. OVN rebinds port: Chassis=compute-1 in Southbound DB", "mode": "arrow", "from": "ovn_sb", "to": "ovn_ctrl_b", "color": "#79c0ff", "num": 14, "fromBottom": true, "toTop": true },
        { "text": "15. New chassis OVN Controller programs local OVS flows", "mode": "lightup", "target": "ovn_ctrl_b", "badge": 15 },
        { "text": "16. Gratuitous ARP sent — MAC moves to new compute", "mode": "lightup", "target": "ovs_b", "badge": "ARP" },
        { "text": "17. Source cleans up: undefine domain, release resources", "mode": "lightup", "target": "libvirt_a", "badge": "🗑" },
        { "text": "18. Source releases Placement allocation (compute-0)", "mode": "lightup", "target": "placement", "badge": "-" },
        { "text": "19. Conductor updates DB: host=compute-1, state=ACTIVE", "mode": "arrow", "from": "nova_compute_b", "to": "nova_conductor", "color": "#3fb950", "num": 19, "fromTop": true, "toBottom": true },
        { "text": "20. VM now running on compute-1 — zero downtime achieved", "mode": "lightup", "target": "vm_b", "badge": "✓" }
      ]
    },
    "edpm_deploy": {
      "label": "③ EDPM Node Deploy (Full)",
      "steps": [
        { "text": "1. Admin applies DataPlaneNodeSet YAML via oc apply", "mode": "arrow", "from": "platform_admin", "to": "nodeset_crd", "color": "#d2a8ff", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. K8s API server validates CRD schema + webhooks", "mode": "lightup", "target": "nodeset_crd", "badge": 2 },
        { "text": "3. OpenStack Operator watch event fires (Reconcile)", "mode": "arrow", "from": "nodeset_crd", "to": "os_operator", "color": "#d2a8ff", "num": 3, "fromTop": true, "toBottom": true },
        { "text": "4. Operator resolves ServiceList → ordered DataPlaneServices", "mode": "arrow", "from": "os_operator", "to": "dp_service", "color": "#d2a8ff", "num": 4, "fromBottom": true, "toTop": true },
        { "text": "5. Services: install_os → configure_network → install_certs → nova → ovn", "mode": "lightup", "target": "dp_service", "badge": 5 },
        { "text": "6. Admin creates DataPlaneDeployment CR (trigger)", "mode": "arrow", "from": "platform_admin", "to": "dp_deployment", "color": "#d2a8ff", "num": 6, "fromRight": true, "toLeft": true },
        { "text": "7. Operator creates K8s Job for Ansible Runner", "mode": "arrow", "from": "dp_deployment", "to": "ansible_runner", "color": "#d2a8ff", "num": 7 },
        { "text": "8. Runner mounts SSH key Secret + generates inventory", "mode": "lightup", "target": "ansible_runner", "badge": 8 },
        { "text": "9. SSH → configure_network: apply NIC templates, routes", "mode": "arrow", "from": "ansible_runner", "to": "nova_compute_a", "color": "#d2a8ff", "num": 9, "fromBottom": true, "toTop": true },
        { "text": "10. SSH → install_certs: deploy TLS CA + service certs", "mode": "lightup", "target": "nova_compute_a", "badge": "TLS" },
        { "text": "11. SSH → ceph_client: deploy ceph.conf + client keyring", "mode": "arrow", "from": "ansible_runner", "to": "ceph_mon", "color": "#d2a8ff", "num": 11, "fromBottom": true, "toTop": true, "waypoints": [{"x": 900, "y": 680}, {"x": 1100, "y": 680}] },
        { "text": "12. SSH → nova: install + configure nova-compute service", "mode": "lightup", "target": "nova_compute_a", "badge": "nova" },
        { "text": "13. SSH → ovn: install ovn-controller + connect to SB", "mode": "arrow", "from": "ansible_runner", "to": "ovn_ctrl_a", "color": "#d2a8ff", "num": 13, "fromBottom": true, "toTop": true },
        { "text": "14. OVN Controller registers chassis in Southbound DB", "mode": "arrow", "from": "ovn_ctrl_a", "to": "ovn_sb", "color": "#79c0ff", "num": 14, "fromTop": true, "toBottom": true },
        { "text": "15. SSH → libvirt: configure QEMU + apparmor/selinux", "mode": "lightup", "target": "libvirt_a", "badge": 15 },
        { "text": "16. Nova-compute reports hypervisor to Placement", "mode": "arrow", "from": "nova_compute_a", "to": "placement", "color": "#3fb950", "num": 16, "fromTop": true, "toBottom": true },
        { "text": "17. Ansible Runner exits 0 — Job completes", "mode": "lightup", "target": "ansible_runner", "badge": "✓" },
        { "text": "18. Operator sets NodeSet status.conditions: Ready=True", "mode": "arrow", "from": "os_operator", "to": "platform_admin", "color": "#3fb950", "num": 18, "fromLeft": true, "toRight": true, "yOff": 10 }
      ]
    },
    "network_prov": {
      "label": "④ Network + Router + FIP",
      "steps": [
        { "text": "1. Tenant: POST /v2.0/networks {type: geneve}", "mode": "arrow", "from": "cloud_user", "to": "keystone", "color": "#f0883e", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. Keystone: token valid, project scoped", "mode": "lightup", "target": "keystone", "badge": "✓" },
        { "text": "3. Request → Neutron API (ML2/OVN plugin)", "mode": "arrow", "from": "keystone", "to": "neutron_api", "color": "#58a6ff", "num": 3 },
        { "text": "4. Neutron persists network + subnet in Galera", "mode": "arrow", "from": "neutron_api", "to": "galera_db", "color": "#58a6ff", "num": 4, "fromBottom": true, "toTop": true },
        { "text": "5. ML2/OVN driver: nb_ovn.ls_add(logical_switch)", "mode": "arrow", "from": "neutron_api", "to": "ovn_nb", "color": "#58a6ff", "num": 5, "fromBottom": true, "toTop": true },
        { "text": "6. OVN NB: Logical_Switch + DHCP_Options created", "mode": "lightup", "target": "ovn_nb", "badge": 6 },
        { "text": "7. Tenant: POST /v2.0/routers + add_router_interface", "mode": "lightup", "target": "neutron_api", "badge": 7 },
        { "text": "8. OVN NB: Logical_Router + router port linking switch", "mode": "lightup", "target": "ovn_nb", "badge": 8 },
        { "text": "9. ovn-northd compiles: NB logical → SB physical flows", "mode": "arrow", "from": "ovn_nb", "to": "ovn_sb", "color": "#79c0ff", "num": 9 },
        { "text": "10. SB publishes flows to all chassis (OVSDB monitor)", "mode": "arrow", "from": "ovn_sb", "to": "ovn_ctrl_a", "color": "#79c0ff", "num": 10, "fromBottom": true, "toTop": true },
        { "text": "11. OVN Controller: install OpenFlow rules in br-int", "mode": "lightup", "target": "ovn_ctrl_a", "badge": 11 },
        { "text": "12. Gateway chassis: bind router for N-S traffic", "mode": "arrow", "from": "ovn_sb", "to": "ovn_gw", "color": "#79c0ff", "num": 12, "fromBottom": true, "toTop": true },
        { "text": "13. Tenant: POST /v2.0/floatingips (associate to port)", "mode": "lightup", "target": "neutron_api", "badge": 13 },
        { "text": "14. OVN NB: NAT rule on Logical_Router (dnat_and_snat)", "mode": "lightup", "target": "ovn_nb", "badge": "NAT" },
        { "text": "15. Gateway: DNAT/SNAT flows installed for floating IP", "mode": "lightup", "target": "ovn_gw", "badge": 15 },
        { "text": "16. FRR/BGP announces floating IP prefix to fabric", "mode": "lightup", "target": "frr", "badge": "BGP" },
        { "text": "17. External network path ready — VM reachable from outside", "mode": "arrow", "from": "ovn_gw", "to": "ext_network", "color": "#3fb950", "num": 17, "fromBottom": true, "toTop": true },
        { "text": "18. Response: floatingip ACTIVE → User", "mode": "arrow", "from": "neutron_api", "to": "cloud_user", "color": "#3fb950", "num": 18, "fromLeft": true, "toRight": true, "yOff": 10 }
      ]
    },
    "storage_attach": {
      "label": "⑤ Volume Create + Attach",
      "steps": [
        { "text": "1. Tenant: POST /v3/volumes {size:50, type:ceph-rbd}", "mode": "arrow", "from": "cloud_user", "to": "keystone", "color": "#f0883e", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. Keystone authenticates + authorizes", "mode": "lightup", "target": "keystone", "badge": "✓" },
        { "text": "3. Cinder API receives create volume request", "mode": "arrow", "from": "keystone", "to": "cinder_api", "color": "#58a6ff", "num": 3 },
        { "text": "4. Cinder persists volume record (status=creating)", "mode": "arrow", "from": "cinder_api", "to": "galera_db", "color": "#58a6ff", "num": 4, "fromBottom": true, "toTop": true },
        { "text": "5. Cinder casts create_volume() to Scheduler", "mode": "arrow", "from": "cinder_api", "to": "cinder_sched", "color": "#58a6ff", "num": 5, "fromBottom": true, "toTop": true },
        { "text": "6. Scheduler: capacity filter → weigher → select backend", "mode": "lightup", "target": "cinder_sched", "badge": 6 },
        { "text": "7. Scheduler → cinder-volume: RPC create on ceph-rbd backend", "mode": "arrow", "from": "cinder_sched", "to": "ceph_mon", "color": "#58a6ff", "num": 7, "fromRight": true, "toLeft": true },
        { "text": "8. Ceph MON authenticates client (cephx)", "mode": "lightup", "target": "ceph_mon", "badge": 8 },
        { "text": "9. rbd create volume-{uuid} --pool volumes --size 50G", "mode": "arrow", "from": "ceph_mon", "to": "ceph_osd", "color": "#58a6ff", "num": 9 },
        { "text": "10. OSD allocates PGs, thin-provisions RBD image", "mode": "lightup", "target": "ceph_osd", "badge": 10 },
        { "text": "11. Volume status → available (Cinder updates Galera)", "mode": "arrow", "from": "ceph_osd", "to": "cinder_api", "color": "#3fb950", "num": 11, "fromLeft": true, "toRight": true },
        { "text": "12. Tenant: POST /servers/{id}/os-volume_attachments", "mode": "lightup", "target": "nova_api", "badge": 12 },
        { "text": "13. Nova calls Cinder: initialize_connection(volume_id)", "mode": "arrow", "from": "nova_api", "to": "cinder_api", "color": "#58a6ff", "num": 13 },
        { "text": "14. Cinder returns RBD connection_info (pool, image, hosts)", "mode": "lightup", "target": "cinder_api", "badge": 14 },
        { "text": "15. Nova Conductor sends attach to compute-0", "mode": "arrow", "from": "nova_conductor", "to": "nova_compute_a", "color": "#58a6ff", "num": 15, "fromBottom": true, "toTop": true },
        { "text": "16. Libvirt: attach-device <disk type='network'> RBD", "mode": "arrow", "from": "nova_compute_a", "to": "libvirt_a", "color": "#58a6ff", "num": 16, "fromBottom": true, "toTop": true },
        { "text": "17. Libvirt opens RBD connection → maps /dev/vdb in guest", "mode": "arrow", "from": "libvirt_a", "to": "ceph_osd", "color": "#58a6ff", "num": 17, "fromRight": true, "toLeft": true, "waypoints": [{"x": 450, "y": 1040}, {"x": 1050, "y": 1040}, {"x": 1050, "y": 344}] },
        { "text": "18. Volume status: in-use → attachment confirmed", "mode": "arrow", "from": "cinder_api", "to": "cloud_user", "color": "#3fb950", "num": 18, "fromLeft": true, "toRight": true, "yOff": 10 }
      ]
    },
    "ctrl_upgrade": {
      "label": "⑥ Control Plane Upgrade",
      "steps": [
        { "text": "1. Admin edits OpenStackControlPlane CR (new version)", "mode": "arrow", "from": "platform_admin", "to": "os_operator", "color": "#d2a8ff", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. OLM updates operator image → new reconcile logic", "mode": "lightup", "target": "olm", "badge": 2 },
        { "text": "3. Operator detects version drift → starts upgrade sequence", "mode": "lightup", "target": "os_operator", "badge": 3 },
        { "text": "4. Step 1: DB schema migration (Galera ALTER TABLE)", "mode": "arrow", "from": "os_operator", "to": "galera_db", "color": "#d2a8ff", "num": 4, "fromTop": true, "toBottom": true },
        { "text": "5. nova-manage db sync + cell_v2 map_instances", "mode": "lightup", "target": "galera_db", "badge": "SQL" },
        { "text": "6. Step 2: RabbitMQ queue schema compatibility check", "mode": "lightup", "target": "rabbitmq", "badge": 6 },
        { "text": "7. Step 3: Rolling restart Keystone pods (new image)", "mode": "lightup", "target": "keystone", "badge": "↻" },
        { "text": "8. Step 4: Rolling restart Nova API (RollingUpdate)", "mode": "lightup", "target": "nova_api", "badge": "↻" },
        { "text": "9. Step 5: Rolling restart Nova Conductor", "mode": "lightup", "target": "nova_conductor", "badge": "↻" },
        { "text": "10. Step 6: Rolling restart Neutron API", "mode": "lightup", "target": "neutron_api", "badge": "↻" },
        { "text": "11. Step 7: Rolling restart Cinder API + Scheduler", "mode": "lightup", "target": "cinder_api", "badge": "↻" },
        { "text": "12. Cert-Manager renews any expiring TLS certificates", "mode": "lightup", "target": "certmgr", "badge": "TLS" },
        { "text": "13. Operator verifies all Deployments: Available=True", "mode": "lightup", "target": "os_operator", "badge": "✓" },
        { "text": "14. OpenStackControlPlane status: version=18.0.2, Ready", "mode": "arrow", "from": "os_operator", "to": "platform_admin", "color": "#3fb950", "num": 14, "fromLeft": true, "toRight": true, "yOff": 10 }
      ]
    },
    "compute_fail": {
      "label": "⑦ Compute Failure + Evacuate",
      "steps": [
        { "text": "1. compute-0 hardware failure (power loss / kernel panic)", "mode": "lightup", "target": "nova_compute_a", "badge": "✗", "errColor": "#f85149" },
        { "text": "2. Libvirt/QEMU processes die — VMs unresponsive", "mode": "lightup", "target": "libvirt_a", "badge": "✗", "errColor": "#f85149" },
        { "text": "3. OVN Controller disconnects from Southbound DB", "mode": "lightup", "target": "ovn_ctrl_a", "badge": "✗", "errColor": "#f85149" },
        { "text": "4. Nova Conductor: service_is_up() returns False (timeout)", "mode": "lightup", "target": "nova_conductor", "badge": "!" },
        { "text": "5. Compute marked DOWN in services table", "mode": "arrow", "from": "nova_conductor", "to": "galera_db", "color": "#f85149", "num": 5, "fromBottom": true, "toTop": true },
        { "text": "6. Instance HA fencing agent detects failure", "mode": "lightup", "target": "os_operator", "badge": 6 },
        { "text": "7. STONITH/IPMI fences compute-0 (ensures clean state)", "mode": "lightup", "target": "nova_compute_a", "badge": "⚡" },
        { "text": "8. Admin/HA: nova evacuate → POST /servers/{id}/action", "mode": "arrow", "from": "os_operator", "to": "nova_api", "color": "#f85149", "num": 8, "fromTop": true, "toBottom": true },
        { "text": "9. Nova API casts rebuild_instance() to Conductor", "mode": "arrow", "from": "nova_api", "to": "nova_conductor", "color": "#f85149", "num": 9, "fromBottom": true, "toLeft": true },
        { "text": "10. Conductor: select new host (Scheduler → compute-1)", "mode": "arrow", "from": "nova_conductor", "to": "nova_sched", "color": "#58a6ff", "num": 10 },
        { "text": "11. Scheduler picks compute-1 + claims Placement", "mode": "lightup", "target": "nova_sched", "badge": 11 },
        { "text": "12. Conductor casts rebuild_instance() to compute-1", "mode": "arrow", "from": "nova_conductor", "to": "nova_compute_b", "color": "#58a6ff", "num": 12, "fromBottom": true, "toTop": true },
        { "text": "13. Compute-1: attach existing RBD volume (shared storage)", "mode": "arrow", "from": "nova_compute_b", "to": "ceph_osd", "color": "#58a6ff", "num": 13, "fromRight": true, "toLeft": true, "waypoints": [{"x": 1050, "y": 940}] },
        { "text": "14. Libvirt spawns VM from same RBD image on compute-1", "mode": "arrow", "from": "nova_compute_b", "to": "libvirt_b", "color": "#58a6ff", "num": 14, "fromBottom": true, "toTop": true },
        { "text": "15. OVN rebinds port to compute-1 chassis", "mode": "arrow", "from": "ovn_sb", "to": "ovn_ctrl_b", "color": "#79c0ff", "num": 15, "fromBottom": true, "toTop": true },
        { "text": "16. VM resumes on compute-1 (data preserved via Ceph)", "mode": "lightup", "target": "vm_b", "badge": "✓" },
        { "text": "17. Placement: deallocate compute-0, confirm compute-1", "mode": "lightup", "target": "placement", "badge": "↻" },
        { "text": "18. VM status: ACTIVE on new host — recovery complete", "mode": "arrow", "from": "nova_compute_b", "to": "nova_conductor", "color": "#3fb950", "num": 18, "fromTop": true, "toBottom": true }
      ]
    },
    "image_boot": {
      "label": "⑧ Glance Image + COW Boot",
      "steps": [
        { "text": "1. Admin: glance image-create --file rhel9.qcow2", "mode": "arrow", "from": "platform_admin", "to": "glance_api", "color": "#58a6ff", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. Glance API validates format + creates image record", "mode": "lightup", "target": "glance_api", "badge": 2 },
        { "text": "3. Glance stores image data → Ceph RGW (S3 backend)", "mode": "arrow", "from": "glance_api", "to": "ceph_rgw", "color": "#58a6ff", "num": 3, "fromRight": true, "toLeft": true },
        { "text": "4. Or: Glance stores as RBD image in 'images' pool", "mode": "arrow", "from": "glance_api", "to": "ceph_images", "color": "#58a6ff", "num": 4, "fromRight": true, "toLeft": true },
        { "text": "5. Ceph: image fully replicated (3x) across OSDs", "mode": "lightup", "target": "ceph_images", "badge": "3x" },
        { "text": "6. Image status: active (location stored in Galera)", "mode": "lightup", "target": "glance_api", "badge": "✓" },
        { "text": "7. Tenant: nova boot --image rhel9 (VM creation begins)", "mode": "arrow", "from": "cloud_user", "to": "nova_api", "color": "#58a6ff", "num": 7, "fromRight": true, "toLeft": true },
        { "text": "8. Nova Compute receives build request on compute-0", "mode": "arrow", "from": "nova_conductor", "to": "nova_compute_a", "color": "#58a6ff", "num": 8, "fromBottom": true, "toTop": true },
        { "text": "9. Compute calls Glance: GET /v2/images/{id} (metadata)", "mode": "arrow", "from": "nova_compute_a", "to": "glance_api", "color": "#58a6ff", "num": 9, "fromTop": true, "toBottom": true },
        { "text": "10. RBD backend: Ceph COW clone (instant, zero-copy)", "mode": "arrow", "from": "nova_compute_a", "to": "ceph_vms", "color": "#d2a8ff", "num": 10, "fromRight": true, "toLeft": true },
        { "text": "11. rbd clone images/rhel9@snap → vms/instance-{uuid}_disk", "mode": "lightup", "target": "ceph_vms", "badge": "COW" },
        { "text": "12. Clone is instant — only delta writes cost storage", "mode": "lightup", "target": "ceph_osd", "badge": 12 },
        { "text": "13. Libvirt domain XML references RBD clone as root disk", "mode": "arrow", "from": "nova_compute_a", "to": "libvirt_a", "color": "#58a6ff", "num": 13, "fromBottom": true, "toTop": true },
        { "text": "14. VM boots from COW clone — near-instant provisioning", "mode": "lightup", "target": "vm_a", "badge": "✓" }
      ]
    },
    "galera_recovery": {
      "label": "⑨ Galera Backup + Failure Recovery",
      "steps": [
        { "text": "1. CronJob triggers scheduled Galera backup (02:00 UTC)", "mode": "lightup", "target": "galera_backup", "badge": "⏰" },
        { "text": "2. Backup pod connects to Galera wsrep donor node", "mode": "arrow", "from": "galera_backup", "to": "galera_db", "color": "#8b949e", "num": 2, "fromLeft": true, "toRight": true },
        { "text": "3. SST snapshot via mariabackup (non-blocking, uses GTID)", "mode": "lightup", "target": "galera_db", "badge": "SST" },
        { "text": "4. Compressed backup written to PVC (galera-backup-pvc)", "mode": "lightup", "target": "galera_backup", "badge": 4 },
        { "text": "5. Backup verified: GTID position recorded in manifest", "mode": "lightup", "target": "galera_backup", "badge": "✓" },
        { "text": "6. ⚠️ FAILURE: Galera node-0 crashes (OOM / disk full)", "mode": "lightup", "target": "galera_db", "badge": "✗", "errColor": "#f85149" },
        { "text": "7. Galera cluster: quorum lost (2/3 nodes still up → OK)", "mode": "lightup", "target": "galera_db", "badge": "2/3" },
        { "text": "8. OpenStack services: DB connections failover to node-1", "mode": "arrow", "from": "nova_api", "to": "galera_db", "color": "#f0883e", "num": 8, "fromBottom": true, "toTop": true },
        { "text": "9. If quorum lost (2/3 down): ALL services pause writes", "mode": "lightup", "target": "keystone", "badge": "!" },
        { "text": "10. Operator detects: MariaDB StatefulSet pod CrashLoopBackOff", "mode": "arrow", "from": "galera_db", "to": "os_operator", "color": "#f85149", "num": 10, "fromBottom": true, "toTop": true },
        { "text": "11. Operator initiates Galera recovery: bootstrap from backup", "mode": "arrow", "from": "os_operator", "to": "galera_backup", "color": "#d2a8ff", "num": 11, "fromRight": true, "toLeft": true },
        { "text": "12. Restore: mariabackup --prepare + --copy-back to PVC", "mode": "arrow", "from": "galera_backup", "to": "galera_db", "color": "#d2a8ff", "num": 12, "fromLeft": true, "toRight": true },
        { "text": "13. First node bootstraps: galera_new_cluster (seqno from GTID)", "mode": "lightup", "target": "galera_db", "badge": "boot" },
        { "text": "14. Remaining nodes IST (Incremental State Transfer) to catch up", "mode": "lightup", "target": "galera_db", "badge": "IST" },
        { "text": "15. Cluster reformed: wsrep_cluster_size=3, synced", "mode": "lightup", "target": "galera_db", "badge": "3/3" },
        { "text": "16. OpenStack services reconnect: write path restored", "mode": "arrow", "from": "galera_db", "to": "nova_api", "color": "#3fb950", "num": 16, "fromTop": true, "toBottom": true },
        { "text": "17. Operator: Galera status Ready=True → Admin notified", "mode": "arrow", "from": "os_operator", "to": "platform_admin", "color": "#3fb950", "num": 17, "fromLeft": true, "toRight": true, "yOff": 10 }
      ]
    },
    "ovn_dhcp": {
      "label": "⑩ OVN Native DHCP (No dnsmasq)",
      "steps": [
        { "text": "1. VM boots → NIC sends DHCPDISCOVER (broadcast)", "mode": "arrow", "from": "vm_a", "to": "ovs_a", "color": "#58a6ff", "num": 1, "fromTop": true, "toBottom": true },
        { "text": "2. OVS br-int: packet hits OpenFlow table (priority=100)", "mode": "lightup", "target": "ovs_a", "badge": 2 },
        { "text": "3. OVN Controller intercepts DHCP via logical flow action", "mode": "arrow", "from": "ovs_a", "to": "ovn_ctrl_a", "color": "#58a6ff", "num": 3 },
        { "text": "4. Controller matches port MAC → DHCP_Options in SB DB", "mode": "lightup", "target": "ovn_ctrl_a", "badge": 4 },
        { "text": "5. OVN native DHCP: NO dnsmasq process needed!", "mode": "lightup", "target": "ovn_ctrl_a", "badge": "!" },
        { "text": "6. DHCP_Options sourced from OVN Northbound DB", "mode": "arrow", "from": "ovn_ctrl_a", "to": "ovn_sb", "color": "#79c0ff", "num": 6, "fromTop": true, "toBottom": true },
        { "text": "7. NB has: subnet CIDR, gateway, DNS, MTU, lease time", "mode": "lightup", "target": "ovn_nb", "badge": 7 },
        { "text": "8. Neutron populated DHCP_Options when subnet was created", "mode": "arrow", "from": "neutron_api", "to": "ovn_nb", "color": "#79c0ff", "num": 8, "fromBottom": true, "toTop": true },
        { "text": "9. OVN Controller constructs DHCPOFFER locally (in datapath)", "mode": "lightup", "target": "ovn_ctrl_a", "badge": "OFFER" },
        { "text": "10. DHCPOFFER: IP=10.0.0.5, GW=10.0.0.1, DNS=8.8.8.8", "mode": "lightup", "target": "ovn_ctrl_a", "badge": 10 },
        { "text": "11. OVS injects DHCPOFFER back to VM's tap interface", "mode": "arrow", "from": "ovn_ctrl_a", "to": "ovs_a", "color": "#3fb950", "num": 11 },
        { "text": "12. VM receives OFFER → sends DHCPREQUEST", "mode": "arrow", "from": "ovs_a", "to": "ovn_ctrl_a", "color": "#58a6ff", "num": 12 },
        { "text": "13. OVN Controller responds with DHCPACK", "mode": "arrow", "from": "ovn_ctrl_a", "to": "ovs_a", "color": "#3fb950", "num": 13 },
        { "text": "14. VM configures: IP 10.0.0.5/24, GW 10.0.0.1", "mode": "lightup", "target": "vm_a", "badge": "✓" },
        { "text": "15. Key insight: DHCP handled entirely in OVS datapath!", "mode": "lightup", "target": "ovs_a", "badge": "⚡" },
        { "text": "16. No dnsmasq pod/process — scales to thousands of ports", "mode": "lightup", "target": "ovn_nb", "badge": "∞" }
      ]
    },
    "provider_net": {
      "label": "⑪ Provider Net (Bridge/Port Detail)",
      "steps": [
        { "text": "1. Admin: openstack network create --provider-network-type vlan --provider-segment 101 --provider-physical-network physnet1", "mode": "arrow", "from": "platform_admin", "to": "neutron_api", "color": "#58a6ff", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. Neutron ML2/OVN: creates provider network (VLAN 101, physnet1)", "mode": "lightup", "target": "neutron_api", "badge": 2 },
        { "text": "3. OVN NB: Logical_Switch created with localnet port (type=localnet)", "mode": "arrow", "from": "neutron_api", "to": "ovn_nb", "color": "#58a6ff", "num": 3, "fromBottom": true, "toTop": true },
        { "text": "4. localnet port options: network_name=physnet1, tag=101", "mode": "lightup", "target": "ovn_nb", "badge": "V101" },
        { "text": "5. ovn-northd → SB: Port_Binding(type=localnet, tag=101)", "mode": "arrow", "from": "ovn_nb", "to": "ovn_sb", "color": "#79c0ff", "num": 5 },
        { "text": "6. OVN Controller reads bridge_mappings: physnet1:br-ex", "mode": "arrow", "from": "ovn_sb", "to": "ovn_ctrl_a", "color": "#79c0ff", "num": 6, "fromBottom": true, "toTop": true },
        { "text": "7. OVS creates patch ports: int-br-ex (on br-int) ↔ phy-br-ex (on br-ex)", "mode": "lightup", "target": "ovs_a", "badge": "patch" },
        { "text": "8. br-ex already has physical NIC (eth1) as port (configured by EDPM)", "mode": "lightup", "target": "ovs_a", "badge": "eth1" },
        { "text": "9. Tenant boots VM: nova boot --nic net-id=provider-vlan101", "mode": "arrow", "from": "cloud_user", "to": "nova_api", "color": "#58a6ff", "num": 9, "fromRight": true, "toLeft": true },
        { "text": "10. Nova → Neutron: create port on provider net (gets IP 203.0.113.101)", "mode": "arrow", "from": "nova_api", "to": "neutron_api", "color": "#58a6ff", "num": 10 },
        { "text": "11. OVN NB: logical port created, bound to chassis=compute-0", "mode": "lightup", "target": "ovn_nb", "badge": 11 },
        { "text": "12. VM spawns → Libvirt creates tap interface (tapXXXX)", "mode": "arrow", "from": "nova_compute_a", "to": "libvirt_a", "color": "#58a6ff", "num": 12, "fromBottom": true, "toTop": true },
        { "text": "13. OVN Controller adds tap port to br-int (iface-id = neutron port UUID)", "mode": "arrow", "from": "ovn_ctrl_a", "to": "ovs_a", "color": "#79c0ff", "num": 13 },
        { "text": "14. === N-S EGRESS PACKET PATH (VM → External) ===", "mode": "lightup", "target": "vm_a", "badge": "TX" },
        { "text": "15. (1) VM eth0 → tap port on br-int (packet enters OVS)", "mode": "arrow", "from": "vm_a", "to": "ovs_a", "color": "#58a6ff", "num": 15, "fromTop": true, "toBottom": true },
        { "text": "16. (2) br-int: conntrack zone check (OVN security group ACLs)", "mode": "lightup", "target": "ovs_a", "badge": "CT" },
        { "text": "17. (3) br-int: OpenFlow adds internal VLAN tag (e.g., tag=5)", "mode": "lightup", "target": "ovs_a", "badge": "tag:5" },
        { "text": "18. (4) br-int: int-br-ex patch port → forwards to br-ex", "mode": "lightup", "target": "ovs_a", "badge": "→patch" },
        { "text": "19. (5) br-ex: phy-br-ex patch port receives frame", "mode": "lightup", "target": "ovs_a", "badge": "patch→" },
        { "text": "20. (6) br-ex: SWAPS internal VLAN tag=5 → actual VLAN 101 (802.1q)", "mode": "lightup", "target": "ovs_a", "badge": "5→101" },
        { "text": "21. (7) br-ex: forwards tagged frame to physical port (eth1)", "mode": "arrow", "from": "ovs_a", "to": "ext_network", "color": "#58a6ff", "num": 21, "fromBottom": true, "toTop": true },
        { "text": "22. (8) eth1 → physical switch: frame on VLAN 101 wire", "mode": "lightup", "target": "ext_network", "badge": "wire" },
        { "text": "23. (9) Switch strips VLAN 101, routes to gateway/Internet", "mode": "lightup", "target": "ext_network", "badge": "→GW" },
        { "text": "24. === INGRESS PATH (External → VM) ===", "mode": "lightup", "target": "ext_network", "badge": "RX" },
        { "text": "25. (10) Switch sends VLAN 101 tagged frame → eth1 on compute-0", "mode": "arrow", "from": "ext_network", "to": "ovs_a", "color": "#3fb950", "num": 25, "fromTop": true, "toBottom": true },
        { "text": "26. (11) br-ex: receives on eth1 port (VLAN 101 tagged)", "mode": "lightup", "target": "ovs_a", "badge": "V101" },
        { "text": "27. (12) br-ex: SWAPS VLAN 101 → internal tag=5", "mode": "lightup", "target": "ovs_a", "badge": "101→5" },
        { "text": "28. (13) br-ex: phy-br-ex → int-br-ex patch port to br-int", "mode": "lightup", "target": "ovs_a", "badge": "→br-int" },
        { "text": "29. (14) br-int: matches internal tag=5 → finds dst tap port", "mode": "lightup", "target": "ovs_a", "badge": "lookup" },
        { "text": "30. (15) br-int: conntrack (established) — SG allows reply", "mode": "lightup", "target": "ovn_ctrl_a", "badge": "CT:est" },
        { "text": "31. (16) br-int: delivers frame to tap port → VM receives packet", "mode": "arrow", "from": "ovs_a", "to": "vm_a", "color": "#3fb950", "num": 31, "fromBottom": true, "toTop": true },
        { "text": "32. Key: NO Geneve/tunnel — direct L2 via VLAN tag swap in OVS!", "mode": "lightup", "target": "vm_a", "badge": "✓" }
      ]
    },
    "vm_to_vm_ping": {
      "label": "⑫ VM-to-VM Ping (OVN/OVS Path)",
      "steps": [
        { "text": "1. VM-A (10.0.0.5) pings VM-B (10.0.0.6) on same subnet", "mode": "arrow", "from": "vm_a", "to": "ovs_a", "color": "#58a6ff", "num": 1, "fromTop": true, "toBottom": true },
        { "text": "2. VM-A needs MAC of VM-B: sends ARP who-has 10.0.0.6", "mode": "lightup", "target": "ovs_a", "badge": "ARP" },
        { "text": "3. OVS br-int: ARP hits OpenFlow table → OVN Controller", "mode": "arrow", "from": "ovs_a", "to": "ovn_ctrl_a", "color": "#58a6ff", "num": 3 },
        { "text": "4. OVN has ARP responder flow (knows all port MACs from NB)", "mode": "lightup", "target": "ovn_ctrl_a", "badge": 4 },
        { "text": "5. OVN replies: 10.0.0.6 is at MAC fa:16:3e:bb:bb:bb", "mode": "arrow", "from": "ovn_ctrl_a", "to": "ovs_a", "color": "#3fb950", "num": 5 },
        { "text": "6. VM-A constructs ICMP echo: dst=fa:16:3e:bb:bb:bb", "mode": "lightup", "target": "vm_a", "badge": "ICMP" },
        { "text": "7. Packet enters br-int on compute-0 via tap-A port", "mode": "arrow", "from": "vm_a", "to": "ovs_a", "color": "#58a6ff", "num": 7, "fromTop": true, "toBottom": true },
        { "text": "8. OpenFlow lookup: dst MAC belongs to port on compute-1", "mode": "lightup", "target": "ovs_a", "badge": 8 },
        { "text": "9. OVS encapsulates in Geneve header (VNI = network segID)", "mode": "arrow", "from": "ovs_a", "to": "geneve_tunnel", "color": "#58a6ff", "num": 9, "fromBottom": true, "toTop": true },
        { "text": "10. Geneve packet: outer IP src=compute-0, dst=compute-1", "mode": "lightup", "target": "geneve_tunnel", "badge": "UDP:6081" },
        { "text": "11. Physical network transports encapsulated packet", "mode": "arrow", "from": "geneve_tunnel", "to": "ovs_b", "color": "#58a6ff", "num": 11, "fromRight": true, "toLeft": true },
        { "text": "12. Compute-1 OVS: decapsulates Geneve, extracts inner frame", "mode": "lightup", "target": "ovs_b", "badge": "decap" },
        { "text": "13. OpenFlow: dst MAC matches local port tap-B", "mode": "lightup", "target": "ovs_b", "badge": 13 },
        { "text": "14. Security group ACL check: ICMP ingress allowed?", "mode": "lightup", "target": "ovn_ctrl_b", "badge": "SG" },
        { "text": "15. Conntrack: ct(commit) — stateful firewall allows", "mode": "lightup", "target": "ovs_b", "badge": "CT" },
        { "text": "16. Packet delivered to VM-B via tap-B interface", "mode": "arrow", "from": "ovs_b", "to": "vm_b", "color": "#3fb950", "num": 16, "fromBottom": true, "toTop": true },
        { "text": "17. VM-B kernel: ICMP echo reply generated", "mode": "lightup", "target": "vm_b", "badge": "reply" },
        { "text": "18. Reply follows reverse path: tap-B → br-int → Geneve → compute-0", "mode": "arrow", "from": "vm_b", "to": "ovs_b", "color": "#3fb950", "num": 18, "fromTop": true, "toBottom": true },
        { "text": "19. Geneve tunnel: compute-1 → compute-0 (reverse)", "mode": "arrow", "from": "ovs_b", "to": "geneve_tunnel", "color": "#3fb950", "num": 19 },
        { "text": "20. Compute-0 decapsulates → delivers to VM-A: ping reply!", "mode": "arrow", "from": "geneve_tunnel", "to": "vm_a", "color": "#3fb950", "num": 20, "fromLeft": true, "toRight": true },
        { "text": "21. VM-A: 64 bytes from 10.0.0.6: icmp_seq=1 time=0.8ms", "mode": "lightup", "target": "vm_a", "badge": "✓" }
      ]
    },
    "ironic_bmc_onboard": {
      "label": "⑬ Ironic + Redfish BMC — EDPM Node Onboarding",
      "steps": [
        { "text": "1. Admin: oc apply BareMetalHost CR for new compute node", "mode": "arrow", "from": "platform_admin", "to": "bmo", "color": "#d2a8ff", "num": 1, "fromRight": true, "toLeft": true },
        { "text": "2. BMH spec: bmc.address=redfish+https://192.168.10.5/redfish/v1/Systems/1", "mode": "lightup", "target": "bmo", "badge": "BMH" },
        { "text": "3. BMO reads BMC credentials from Secret (spec.bmc.credentialsName)", "mode": "lightup", "target": "bmo", "badge": "secret" },
        { "text": "4. BMO calls Ironic API: POST /v1/nodes (driver=redfish, driver_info)", "mode": "arrow", "from": "bmo", "to": "ironic", "color": "#d2a8ff", "num": 4 },
        { "text": "5. Ironic registers node: provision_state=enroll → manageable", "mode": "lightup", "target": "ironic", "badge": "enroll" },
        { "text": "6. Ironic persists node record in Galera DB", "mode": "arrow", "from": "ironic", "to": "galera_db", "color": "#58a6ff", "num": 6, "fromBottom": true, "toTop": true },
        { "text": "7. BMO sets BareMetalHost status: state=registering → inspecting", "mode": "lightup", "target": "bmo", "badge": "inspecting" },
        { "text": "8. Ironic Conductor: GET /redfish/v1/Systems/1 (verify BMC reachable)", "mode": "arrow", "from": "ironic", "to": "redfish_bmc_a", "color": "#f0883e", "num": 8, "fromBottom": true, "toTop": true },
        { "text": "9. BMC responds: 200 OK {PowerState: Off, Model: PowerEdge R750}", "mode": "lightup", "target": "redfish_bmc_a", "badge": "200" },
        { "text": "10. Ironic: POST /redfish/v1/Managers/1/VirtualMedia/CD1/Actions/InsertMedia", "mode": "arrow", "from": "ironic", "to": "redfish_bmc_a", "color": "#f0883e", "num": 10, "fromBottom": true, "toTop": true },
        { "text": "11. BMC mounts IPA deploy ramdisk ISO via virtual media", "mode": "lightup", "target": "redfish_bmc_a", "badge": "ISO" },
        { "text": "12. Ironic: PATCH /redfish/v1/Systems/1 Boot={BootSourceOverrideTarget: Cd}", "mode": "lightup", "target": "redfish_bmc_a", "badge": "boot=CD" },
        { "text": "13. Ironic: POST /Systems/1/Actions/ComputerSystem.Reset {ResetType: On}", "mode": "arrow", "from": "ironic", "to": "redfish_bmc_a", "color": "#f0883e", "num": 13, "fromBottom": true, "toTop": true },
        { "text": "14. BMC powers on server → boots from virtual media ISO", "mode": "lightup", "target": "redfish_bmc_a", "badge": "POWER ON" },
        { "text": "15. IPA ramdisk boots on bare metal, starts ironic-python-agent.service", "mode": "arrow", "from": "redfish_bmc_a", "to": "ipa_ramdisk", "color": "#d2a8ff", "num": 15 },
        { "text": "16. IPA: POST /v1/lookup?addresses=aa:bb:cc:dd:ee:ff → finds Ironic node", "mode": "arrow", "from": "ipa_ramdisk", "to": "ironic", "color": "#d2a8ff", "num": 16, "fromTop": true, "toBottom": true },
        { "text": "17. IPA begins heartbeat loop: POST /v1/heartbeat/{node_uuid}", "mode": "lightup", "target": "ipa_ramdisk", "badge": "heartbeat" },
        { "text": "18. Ironic sends inspect command → IPA collects: lshw, lsblk, dmidecode", "mode": "lightup", "target": "ipa_ramdisk", "badge": "lshw" },
        { "text": "19. IPA returns inventory: 2×Xeon, 512GB RAM, 4×NVMe, 2×25GbE NIC", "mode": "arrow", "from": "ipa_ramdisk", "to": "ironic", "color": "#3fb950", "num": 19, "fromTop": true, "toBottom": true },
        { "text": "20. Ironic stores HW inventory → BMO updates BMH status.hardware", "mode": "arrow", "from": "ironic", "to": "bmo", "color": "#3fb950", "num": 20 },
        { "text": "21. Node provision_state: inspecting → manageable → available", "mode": "lightup", "target": "ironic", "badge": "available" },
        { "text": "22. Admin: oc apply OpenStackDataPlaneNodeSet (references BMH)", "mode": "arrow", "from": "platform_admin", "to": "nodeset_crd", "color": "#d2a8ff", "num": 22, "fromRight": true, "toLeft": true },
        { "text": "23. OpenStack Operator reconciles: creates DataPlaneDeployment", "mode": "arrow", "from": "os_operator", "to": "dp_deployment", "color": "#d2a8ff", "num": 23 },
        { "text": "24. Ironic provisions: IPA writes RHEL 9 image to /dev/sda", "mode": "arrow", "from": "ironic", "to": "ipa_ramdisk", "color": "#d2a8ff", "num": 24, "fromBottom": true, "toTop": true },
        { "text": "25. IPA: dd if=rhel9.qcow2 → /dev/sda + configdrive partition", "mode": "lightup", "target": "ipa_ramdisk", "badge": "dd→sda" },
        { "text": "26. Ironic sets boot to HDD, reboots via Redfish Reset", "mode": "arrow", "from": "ironic", "to": "redfish_bmc_a", "color": "#f0883e", "num": 26, "fromBottom": true, "toTop": true },
        { "text": "27. BMC: Boot={BootSourceOverrideTarget: Hdd} + Reset{GracefulRestart}", "mode": "lightup", "target": "redfish_bmc_a", "badge": "boot=HDD" },
        { "text": "28. Node boots into RHEL 9, provision_state: active", "mode": "lightup", "target": "ironic", "badge": "active" },
